<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <script>
      // Antes de desenhar a página, para o tema escolhido não piscar ao abrir.
      try {
        if (localStorage.getItem('treinador:tema') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#e6e6ea'
        }
      } catch {}
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Virada" />
    <meta name="description" content="Toda partida tem um ponto de virada. Ache o seu: o Virada analisa suas partidas do chess.com com Stockfish no seu navegador. Grátis e sem cadastro." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Virada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
